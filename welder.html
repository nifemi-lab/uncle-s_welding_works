<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Welders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24211f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
.bar{background:var(--char);color:#fff;border-bottom:3px solid var(--spark)}
.bar .in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px}
.bar h1{font-size:24px;color:#fff}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.page{max-width:820px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--paper);border:1.5px solid var(--char);border-radius:var(--radius);padding:20px;margin-top:14px}
.card h2{font-size:32px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:14px 0;font-size:16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.phs a{width:96px;height:96px;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--line);display:block;background:#fff}
.phs img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.err{color:var(--danger);font-weight:600;min-height:1.5em;margin:10px 0 0}
.st{font-size:14px;font-weight:600;padding:3px 12px;border-radius:20px}
.st-open{background:#ffe1cf;color:#7a2c00}
.st-accepted{background:#d6f0df;color:#0d5229}
.st-declined{background:#f2e3c8;color:#623d00}
.fld{margin:0 0 14px}
.seg{display:flex;gap:8px;margin-bottom:6px}
.job{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.job.won{border-color:var(--ok)}
.job h3{font-size:26px;margin-bottom:6px}
.job .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.me{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--char);color:#fff;border-radius:var(--radius);padding:16px 18px}
.me .who{flex:1;min-width:200px}
.me .who b{font-family:var(--font-head);font-size:28px;display:block;line-height:1}
.me .who span{font-size:15px;color:#d2cac2}
.note{background:#fff3cd;color:#5c4400;padding:12px 16px;border-radius:var(--radius);font-size:15px;margin-bottom:6px}
.note.ok{background:#d6f0df;color:#0d5229}
.demo{background:#fff3cd;color:#5c4400;padding:10px 14px;border-radius:var(--radius);font-size:15px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--char);color:#fff;padding:10px 18px;border-radius:var(--radius);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.show{opacity:1}
.toast.bad{background:var(--danger)}
</style>
</head>
<body>

<div class="bar"><div class="in">
  <div style="display:flex;align-items:center;gap:10px;min-width:0">
    <i class="ti ti-flame" aria-hidden="true" style="color:var(--spark)"></i>
    <h1 id="bizName">Welders</h1>
  </div>
  <div class="acts">
    <a class="btn btn-ghost btn-sm" href="index.html">Website</a>
    <button class="btn btn-ghost btn-sm" id="signOut" type="button" hidden>Sign out</button>
  </div>
</div></div>

<div class="page">
  <div class="demo" id="demoNote" hidden>Demo mode: sign-in only works in this browser. Follow README.md to connect the real database.</div>
  <div id="box"><p class="hint">Loading...</p></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
<script>
(function () {
  'use strict';
  var cfg = window.SITE_CONFIG || {}, API = window.API;
  document.title = 'Welders | ' + (cfg.BUSINESS_NAME || '');
  document.getElementById('bizName').textContent = cfg.BUSINESS_NAME || 'Welders';
  if (API.demo) document.getElementById('demoNote').hidden = false;

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function trim(s) { return String(s || '').replace(/^\s+|\s+$/g, ''); }

  var token = (location.search.match(/[?&]token=([^&]+)/) || [])[1] || '';
  var data = null;
  var board = { worker: null, jobs: [] };

  /* =========================================================
     PART 1 - the old offer link (welder.html?token=...)
     Unchanged: still works without signing in.
     ========================================================= */
  function detailRows(r) {
    var rows = [];
    Object.keys(r.details || {}).forEach(function (k) { rows.push([k, r.details[k]]); });
    rows = rows.concat([
      ['Material', r.material], ['Finish', r.finish], ['Budget', r.budget],
      ['Needed', r.needed_by], ['Area', r.location], ['Customer notes', r.notes]
    ]);
    return rows.filter(function (x) { return x[1]; });
  }

  function kvHtml(r) {
    return detailRows(r).map(function (x) {
      return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>';
    }).join('');
  }
  function photosHtml(r) {
    return (r.photos && r.photos.length)
      ? '<div class="phs">' + r.photos.map(function (u) {
          return '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="Customer photo"></a>';
        }).join('') + '</div>'
      : '';
  }

  function renderOpen() {
    var r = data.request;
    $('#box').innerHTML =
      '<div class="card"><h2>' + esc(r.item) + ' <span class="st st-open">Open</span></h2>' +
      '<p class="hint">Hello ' + esc(data.worker.name) + ', this job was sent to you because you are available. Take it and the customer\'s number is yours.</p>' +
      '<dl class="kv">' + kvHtml(r) + '</dl>' + photosHtml(r) +
      '<p class="err" id="err" role="alert"></p>' +
      '<div class="row">' +
      '<button type="button" class="btn btn-primary" id="yes"><i class="ti ti-check" aria-hidden="true"></i>I\'ll take this job</button>' +
      '<button type="button" class="btn btn-quiet" id="no">Not for me</button>' +
      '</div></div>';
    $('#yes').addEventListener('click', function () { respond(true); });
    $('#no').addEventListener('click', function () { respond(false); });
  }

  function renderDone(res) {
    var r = res.request || (data && data.request) || {};
    var refTxt = r.ref ? ' (' + esc(r.ref) + ')' : '';
    if (res.error === 'taken') {
      $('#box').innerHTML = '<div class="card"><h2>Too late</h2><p>Another welder already took this job' + refTxt + '. The next one is yours if you are quick.</p></div>';
      return;
    }
    if (res.error === 'declined' || res.error === 'accepted') {
      $('#box').innerHTML = '<div class="card"><h2>Already answered</h2><p>You already answered this offer' + refTxt + '. Nothing more to do here.</p></div>';
      return;
    }
    if (res.error) {
      $('#box').innerHTML = '<div class="card"><h2>Link not valid</h2><p>This offer link is not valid any more. Ask the workshop to send it again.</p></div>';
      return;
    }
    if (res.status === 'accepted') {
      var wa = 'https://wa.me/' + API.toIntl(r.customer_phone) + '?text=' + encodeURIComponent(
        'Hello ' + r.customer_name + ', this is ' + (data ? data.worker.name : 'your welder') +
        ' from ' + (cfg.BUSINESS_NAME || 'the workshop') + '. I took your request ' + r.ref + ' (' + r.item + ').');
      var custNum = API.formatDisplay(r.customer_phone) || r.customer_phone;
      $('#box').innerHTML = '<div class="card"><h2>Job is yours <span class="st st-accepted">Accepted</span></h2>' +
        '<p>Request ' + esc(r.ref) + ' is now assigned to you. Message ' + esc(r.customer_name) + ' to agree the price and the date.</p>' +
        '<p style="margin-top:14px"><a class="btn btn-wa" href="' + esc(wa) + '" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i>Message ' + esc(r.customer_name) + '</a></p>' +
        '<p class="hint" style="margin-top:10px">Customer number: <strong>' + esc(custNum) + '</strong> &middot; <a href="tel:' + esc(API.toIntl(r.customer_phone)) + '">Call instead</a> if WhatsApp cannot find it.</p></div>';
      return;
    }
    $('#box').innerHTML = '<div class="card"><h2>No problem <span class="st st-declined">Declined</span></h2>' +
      '<p>Thanks for answering. The job stays open for the other welders.</p></div>';
  }

  function respond(accept) {
    var yes = $('#yes'), no = $('#no');
    if (yes) yes.disabled = true;
    if (no) no.disabled = true;
    API.respondOffer(token, accept).then(function (res) {
      renderDone(res);
    }).catch(function () {
      if (yes) yes.disabled = false;
      if (no) no.disabled = false;
      var e = $('#err');
      if (e) e.textContent = 'Could not reach the website. Check your internet and try again.';
    });
  }

  function runOfferLink() {
    if (!token) return false;
    API.getOffer(token).then(function (d) {
      data = d;
      if (!d) {
        $('#box').innerHTML = '<div class="card"><h2>Link not valid</h2><p>This offer link is not valid any more. Ask the workshop to send it again.</p></div>';
        return;
      }
      if (d.offer.status === 'open') renderOpen();
      else if (d.offer.status === 'accepted') renderDone({ error: 'accepted', request: d.request });
      else renderDone({ error: 'declined', request: d.request });
    }).catch(function () {
      $('#box').innerHTML = '<div class="card"><h2>Could not load</h2><p>Check your internet and open the link again.</p></div>';
    });
    return true;
  }

  /* =========================================================
     PART 2 - sign in, sign up, and the welder's job board
     ========================================================= */
  function pendingIntent() {
    try { return JSON.parse(localStorage.getItem('welder_intent') || 'null'); } catch (e) { return null; }
  }
  function saveIntent(name, phone, pin) {
    try { localStorage.setItem('welder_intent', JSON.stringify({ name: name, phone: phone, pin: pin || '' })); } catch (e) {}
  }
  function clearIntent() {
    try { localStorage.removeItem('welder_intent'); } catch (e) {}
  }

  function links(extra) {
    return '<div class="row" style="margin-top:16px">' +
      (extra || '') +
      '<a class="btn btn-quiet btn-sm" href="admin.html">Staff / owner sign in</a>' +
      '</div>';
  }

  function showSignIn(err) {
    $('#signOut').hidden = true;
    $('#box').innerHTML =
      '<div class="card" style="max-width:420px;margin:40px auto">' +
      '<h2>Welder sign in</h2>' +
      '<p class="hint">Only welders the workshop has added can sign in.</p>' +
      '<div class="fld"><label class="lab" for="em">Email</label><input class="inp" id="em" type="email" autocomplete="username"></div>' +
      '<div class="fld"><label class="lab" for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password"></div>' +
      '<p class="err" id="err" role="alert">' + esc(err || '') + '</p>' +
      '<button class="btn btn-primary" type="button" id="doIn" style="width:100%">Sign in</button>' +
      '<p style="margin:14px 0 0"><a href="#" id="toUp">Sign up as a welder</a></p>' +
      '<p class="hint" style="margin-top:10px">New staff member? <a href="#" id="toCode">Enter your invite code</a></p>' +
      '</div>';

    function go() {
      var e = $('#err'); e.textContent = '';
      API.signIn(trim($('#em').value), $('#pw').value).then(afterSignIn)
        .catch(function () { e.textContent = 'That email or password is wrong. Try again.'; });
    }
    $('#doIn').addEventListener('click', go);
    $('#pw').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    $('#toUp').addEventListener('click', function (ev) { ev.preventDefault(); showSignUp(); });
    $('#toCode').addEventListener('click', function (ev) { ev.preventDefault(); showInvite(); });
  }

  function showSignUp(err) {
    $('#signOut').hidden = true;
    $('#box').innerHTML =
      '<div class="card" style="max-width:460px;margin:40px auto">' +
      '<h2>Sign up as a welder</h2>' +
      '<p class="hint">This only works if the workshop already added your WhatsApp number. If it is not on the list yet, your request goes to the owner to approve.</p>' +
      '<div class="fld"><label class="lab" for="sn">Your name</label><input class="inp" id="sn" autocomplete="name"></div>' +
      '<div class="fld"><label class="lab" for="sp">Your WhatsApp number</label><input class="inp" id="sp" type="tel" placeholder="081 0628 5867" autocomplete="tel"><p class="hint" id="spHint" style="margin-top:6px"></p></div>' +
      '<div class="fld"><label class="lab" for="sc">6-digit code from the workshop</label><input class="inp" id="sc" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code"><p class="hint" id="scHint" style="margin-top:6px">The owner reads this code out when they add you. It proves the number is really yours.</p></div>' +
      '<div class="fld"><label class="lab" for="se">Email (used to sign in)</label><input class="inp" id="se" type="email" autocomplete="username"></div>' +
      '<div class="fld"><label class="lab" for="spw">Password (8 characters or more)</label><input class="inp" id="spw" type="password" autocomplete="new-password"></div>' +
      '<p class="err" id="err" role="alert">' + esc(err || '') + '</p>' +
      '<button class="btn btn-primary" type="button" id="doUp" style="width:100%">Create my account</button>' +
      '<p style="margin:14px 0 0"><a href="#" id="toIn">I already have an account - sign in</a></p>' +
      '</div>';

    $('#sp').addEventListener('input', function () {
      var v = trim(this.value), h = $('#spHint');
      if (!v) { h.textContent = ''; h.className = 'hint'; return; }
      if (API.isValidNgPhone(v)) { h.textContent = 'WhatsApp will use: ' + API.formatDisplay(v); h.className = 'hint'; }
      else { h.textContent = 'Type it like 0803 123 4567 (11 digits starting with 0).'; h.className = 'hint bad'; }
    });
    $('#toIn').addEventListener('click', function (ev) { ev.preventDefault(); showSignIn(); });

    $('#doUp').addEventListener('click', function () {
      var e = $('#err'); e.textContent = '';
      var name = trim($('#sn').value), phone = trim($('#sp').value),
          pin = trim($('#sc').value).replace(/\D/g, ''),
          email = trim($('#se').value).toLowerCase(), pw = $('#spw').value;
      if (name.length < 2) { e.textContent = 'Enter your name.'; return; }
      if (!API.isValidNgPhone(phone)) { e.textContent = 'Enter a full Nigerian WhatsApp number, like 0803 123 4567.'; return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { e.textContent = 'Enter a valid email address.'; return; }
      if (pw.length < 8) { e.textContent = 'Use at least 8 characters for the password.'; return; }
      var intl = API.toIntl(phone);
      var btn = $('#doUp'); btn.disabled = true; btn.textContent = 'Creating...';

      API.welderPhoneStatus(intl).then(function (st) {
        if (st && st.state === 'in_use') {
          btn.disabled = false; btn.textContent = 'Create my account';
          e.textContent = 'This number already has a welder account. Sign in with it instead.';
          return null;
        }
        if (st && st.state === 'ready' && !/^\d{6}$/.test(pin)) {
          btn.disabled = false; btn.textContent = 'Create my account';
          e.textContent = 'Enter the 6-digit code the workshop gave you for this number.';
          return null;
        }
        return API.signUp(email, pw).then(function (r) {
          if (r && r.needsConfirm) {
            saveIntent(name, intl, pin);
            $('#box').innerHTML = '<div class="card" style="max-width:460px;margin:40px auto">' +
              '<h2>Check your email</h2>' +
              '<p class="note">We sent a confirmation link to <strong>' + esc(email) + '</strong>. Open it, then come back here and sign in - your details are saved on this device.</p>' +
              '<div class="row"><button class="btn btn-primary" type="button" id="backIn">I have confirmed - sign in</button></div></div>';
            $('#backIn').addEventListener('click', function () { showSignIn(); });
            return null;
          }
          return finishSetup(name, intl, pin);
        });
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = 'Create my account';
        e.textContent = signupError(err);
      });
    });
  }

  // Turn the real Supabase answer into something a person can act on.
  function signupError(err) {
    var m = (err && err.message) ? String(err.message) : '';
    if (m.indexOf('already') > -1) return 'That email is already registered. Sign in instead.';
    if (/rate limit/i.test(m))
      return 'Supabase limits how many confirmation emails it sends. Wait about 15 minutes, then try again.';
    if (/signups? .*disabled|sign.?ups? .*not allowed|registration .*disabled/i.test(m))
      return 'Sign-ups are switched off in Supabase. The owner must turn on "Allow new users to sign up" (Authentication -> Providers -> Email).';
    if (m.indexOf('is not a function') > -1)
      return 'Your browser loaded an old copy of the site. Press Ctrl+Shift+R to refresh, then try again.';
    if (m.indexOf('does not exist') > -1)
      return 'The database is not set up yet. Run supabase-setup.sql in Supabase, then reload.';
    if (/failed to fetch|networkerror|network request failed/i.test(m))
      return 'Could not reach the server. Check your internet connection, wait a few seconds and try again.';
    if (m) return 'Could not create the account. The server said: ' + m;
    return 'Could not create the account. Check your internet and try again.';
  }

  function showInvite(err) {
    $('#signOut').hidden = true;
    $('#box').innerHTML =
      '<div class="card" style="max-width:420px;margin:40px auto">' +
      '<h2>Join the staff</h2>' +
      '<p class="hint">Ask the owner for an invite code, then sign in first.</p>' +
      '<div class="fld"><label class="lab" for="ic">Invite code</label><input class="inp" id="ic" placeholder="A1B2C3D4" autocapitalize="characters"></div>' +
      '<p class="err" id="err" role="alert">' + esc(err || '') + '</p>' +
      '<button class="btn btn-primary" type="button" id="doCode" style="width:100%">Use this code</button>' +
      '<p style="margin:14px 0 0"><a href="#" id="back">Back</a></p>' +
      '</div>';
    $('#back').addEventListener('click', function (ev) { ev.preventDefault(); showSignIn(); });
    $('#doCode').addEventListener('click', function () {
      var e = $('#err'); e.textContent = '';
      var code = trim($('#ic').value);
      if (code.length < 4) { e.textContent = 'Type the code the owner gave you.'; return; }
      API.getSession().then(function (s) {
        if (!s) { showSignIn('Sign in with your email first, then enter the code.'); return; }
        return API.redeemInvite(code).then(function () {
          location.href = 'admin.html';
        }).catch(function (err) {
          e.textContent = (err && err.message) ? err.message : 'That code did not work.';
        });
      });
    });
  }

  function finishSetup(name, phone, pin) {
    return API.finishWelderSetup(name, phone, pin).then(function (res) {
      clearIntent();
      if (res && res.error) {
        if (res.error === 'in_use') showSignIn('That WhatsApp number already belongs to another welder account.');
        else if (res.error === 'sign_in') showSignIn('Sign in first, then finish setting up.');
        else if (res.error === 'bad_pin') showSetup('That 6-digit code is not right for this number. Ask the workshop for the code they see next to your name.');
        else showSetup('Could not save those details. Check the name and number and try again.');
        return null;
      }
      if (res && res.mode === 'queued') {
        showWaiting(name);
        return null;
      }
      showApp();
      return null;
    }).catch(function () {
      showSignUp('Could not save your details. Check your internet and try again.');
      return null;
    });
  }

  function showWaiting(name) {
    $('#signOut').hidden = false;
    $('#box').innerHTML =
      '<div class="card" style="max-width:560px;margin:40px auto">' +
      '<h2>Sent for approval</h2>' +
      '<p class="note">Thanks ' + esc(name || '') + '. Your number is not on the workshop list yet, so your request is waiting for the owner to approve it. You will get access as soon as it is approved.</p>' +
      '<p class="hint">Sign out, or keep this page - press Refresh after a while to check.</p>' +
      '<div class="row"><button class="btn btn-quiet" type="button" id="recheck">Check again</button></div>' +
      '<div id="sPf"></div></div>';
    $('#recheck').addEventListener('click', function () {
      API.getMyWorker().then(function (w) {
        if (w) { board.worker = w; loadBoard(); }
        else { showWaiting(name); }
      }).catch(function () { showWaiting(name); });
    });
    // The owner looks at these before deciding, so show your work while you wait.
    API.listSignups().then(function (rows) {
      var mine = (rows || []).filter(function (x) { return x.status === 'pending'; })[0];
      renderWaitingPf(name, mine ? (mine.photos || []) : []);
    }).catch(function () {
      var box = $('#sPf');
      if (box) box.innerHTML = '<p class="hint">Could not load your saved photos. Check your internet and press Check again.</p>';
    });
  }

  function renderWaitingPf(name, photos) {
    var box = $('#sPf');
    if (!box) return;
    box.innerHTML =
      '<h3 style="font-size:22px;margin:20px 0 6px">Show your work while you wait</h3>' +
      '<p class="hint">Add photos of jobs you have done. The owner sees them before approving you, and they stay as your portfolio on the website (customers need at least 3).</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
      photos.map(function (u, i) {
        return '<span style="position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)">' +
          '<img src="' + esc(u) + '" alt="My work" style="width:100%;height:100%;object-fit:cover">' +
          '<button type="button" data-spf="' + i + '" aria-label="Remove photo" style="position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:14px;line-height:1">&times;</button></span>';
      }).join('') +
      '</div>' +
      '<div class="row" style="margin-top:10px">' +
      '<label class="btn btn-primary btn-sm" style="cursor:pointer"><i class="ti ti-photo" aria-hidden="true"></i>Add photos of your work' +
      '<input type="file" id="sPfAdd" accept="image/*" multiple style="display:none"></label>' +
      '<span class="hint">' + photos.length + ' of 12 added</span></div>' +
      '<p class="err" id="sPfErr" role="alert"></p>';

    function fail(msg) {
      var e = $('#sPfErr');
      if (e) e.textContent = msg;
    }
    function save(next) {
      API.saveSignupPhotos(next).then(function () { renderWaitingPf(name, next); })
        .catch(function () { fail('Could not save. Check your internet and try again.'); });
    }
    var input = $('#sPfAdd');
    if (input) input.addEventListener('change', function () {
      var files = this.files;
      this.value = '';
      if (!files || !files.length) return;
      if (photos.length + files.length > 12) { fail('Maximum of 12 photos.'); return; }
      API.uploadPhotos('signup-' + Math.random().toString(36).slice(2, 10), Array.prototype.slice.call(files, 0, 3))
        .then(function (urls) { save(photos.concat(urls)); })
        .catch(function () { fail('Could not upload. Try smaller photos or check your internet.'); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-spf]'), function (btn) {
      btn.addEventListener('click', function () {
        var i = parseInt(btn.getAttribute('data-spf'), 10);
        save(photos.slice(0, i).concat(photos.slice(i + 1)));
      });
    });
  }

  function showNoAccess() {
    $('#signOut').hidden = false;
    $('#box').innerHTML =
      '<div class="card" style="max-width:520px;margin:40px auto">' +
      '<h2>No access yet</h2>' +
      '<p>This login is not linked to a welder, staff or owner account. If you are a welder, sign up with the WhatsApp number the workshop has on file.</p>' +
      '<div class="row"><button class="btn btn-primary" type="button" id="setupNow">Set up my welder account</button>' +
      '<button class="btn btn-quiet" type="button" id="out2">Sign out</button></div></div>';
    $('#setupNow').addEventListener('click', showSetup);
    $('#out2').addEventListener('click', doSignOut);
  }

  function showSetup(err) {
    var i = pendingIntent();
    $('#signOut').hidden = false;
    $('#box').innerHTML =
      '<div class="card" style="max-width:460px;margin:40px auto">' +
      '<h2>Finish setting up</h2>' +
      '<p class="hint">Enter your WhatsApp number so we can match you to the workshop\'s list.</p>' +
      '<div class="fld"><label class="lab" for="un">Your name</label><input class="inp" id="un" value="' + esc((i && i.name) || '') + '"></div>' +
      '<div class="fld"><label class="lab" for="up">Your WhatsApp number</label><input class="inp" id="up" type="tel" placeholder="081 0628 5867" value="' + esc((i && i.phone) || '') + '"></div>' +
      '<div class="fld"><label class="lab" for="uc">6-digit code from the workshop</label><input class="inp" id="uc" type="text" inputmode="numeric" maxlength="6" placeholder="123456" value="' + esc((i && i.pin) || '') + '"><p class="hint" style="margin-top:6px">The owner reads this code out when they add you.</p></div>' +
      '<p class="err" id="err" role="alert">' + esc(err || '') + '</p>' +
      '<button class="btn btn-primary" type="button" id="doSetup" style="width:100%">Save</button></div>';
    $('#doSetup').addEventListener('click', function () {
      var e = $('#err'); e.textContent = '';
      var name = trim($('#un').value), phone = trim($('#up').value);
      var pin = trim($('#uc').value).replace(/\D/g, '');
      if (name.length < 2) { e.textContent = 'Enter your name.'; return; }
      if (!API.isValidNgPhone(phone)) { e.textContent = 'Enter a full Nigerian WhatsApp number, like 0803 123 4567.'; return; }
      finishSetup(name, API.toIntl(phone), pin);
    });
  }

  /* ---------------- job board ---------------- */
  function jobCard(o) {
    var r = o.requests || {};
    var cls = o.status === 'accepted' ? ' accepted' : '';
    var badge = o.status === 'open' ? '<span class="st st-open">Open</span>'
      : o.status === 'accepted' ? '<span class="st st-accepted">Yours</span>'
      : '<span class="st st-declined">Passed</span>';
    var acts = '';
    if (o.status === 'open') {
      acts = '<div class="row" style="margin-top:6px">' +
        '<button type="button" class="btn btn-primary btn-sm" data-act="take" data-token="' + esc(o.token) + '"><i class="ti ti-check" aria-hidden="true"></i>I\'ll take this job</button>' +
        '<button type="button" class="btn btn-quiet btn-sm" data-act="pass" data-token="' + esc(o.token) + '">Not for me</button></div>';
    } else if (o.status === 'accepted') {
      var wa = 'https://wa.me/' + API.toIntl(r.customer_phone) + '?text=' + encodeURIComponent(
        'Hello ' + (r.customer_name || '') + ', this is ' + (board.worker ? board.worker.name : 'your welder') +
        ' from ' + (cfg.BUSINESS_NAME || 'the workshop') + '. I took your request ' + (r.ref || '') + ' (' + (r.item || '') + ').');
      acts = '<div class="row" style="margin-top:6px">' +
        '<a class="btn btn-wa btn-sm" href="' + esc(wa) + '" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i>Message ' + esc(r.customer_name || 'customer') + '</a>' +
        '<a class="btn btn-quiet btn-sm" href="tel:' + esc(API.toIntl(r.customer_phone)) + '">Call customer</a></div>' +
        '<p class="hint" style="margin-top:8px">Customer number: <strong>' + esc(API.formatDisplay(r.customer_phone) || r.customer_phone || '') + '</strong></p>';
    }
    return '<div class="job' + cls + '" data-id="' + esc(o.id) + '">' +
      '<div class="top"><h3>' + esc(r.item || 'Job') + '</h3>' + badge + '</div>' +
      '<p class="hint">' + esc(r.ref || '') + ' &middot; sent ' + esc(fmt(o.created_at)) + '</p>' +
      '<dl class="kv">' + kvHtml(r) + '</dl>' + photosHtml(r) +
      '<p class="err" data-jerr="' + esc(o.id) + '" role="alert"></p>' + acts + '</div>';
  }

  function fmt(iso) {
    try { return new Date(iso).toLocaleString('en-NG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return iso || ''; }
  }

  function renderBoard() {
    var w = board.worker;
    var shopNum = API.toIntl(cfg.FALLBACK_WHATSAPP);
    var shopBtn = shopNum
      ? '<a class="btn btn-wa btn-sm" href="https://wa.me/' + shopNum + '?text=' + encodeURIComponent('Hello ' + (cfg.BUSINESS_NAME || 'the workshop') + ', this is ' + w.name + ' from the job board.') + '" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i>Message the shop</a>'
      : '';
    var head =
      '<div class="me"><div class="who"><b>' + esc(w.name) + '</b>' +
      '<span>' + esc(w.specialty || 'Welder') + ' &middot; ' + esc(API.formatDisplay(w.phone) || w.phone) + '</span></div>' +
      '<span class="badge ' + (w.available ? 'b-ok' : 'b-busy') + '">' + (w.available ? 'Available' : 'Busy') + '</span>' +
      shopBtn +
      '<button type="button" class="btn btn-ghost btn-sm" id="toggleAv">' + (w.available ? 'Mark me busy' : 'Mark me available') + '</button>' +
      '</div>';

    var jobs = board.jobs.length
      ? board.jobs.map(jobCard).join('')
      : '<div class="job"><h3>No jobs yet</h3><p class="hint">New work shows up here as soon as the workshop sends it. Press Refresh to check again.</p></div>';

    var pf = board.photos || [];
    var NEED = 3, met = pf.length >= NEED;
    var pfCard =
      '<div class="job" style="margin-top:14px">' +
      '<h3 style="font-size:22px">Your work ' +
      '<span class="hint" style="font-weight:400">(' + Math.min(pf.length, NEED) + ' of ' + NEED + ' photos - customers need ' + NEED + ' to pick you)</span></h3>' +
      (met
        ? '<p class="hint">Live: customers can see your work and pick you by name on the website.</p>'
        : '<p class="hint">Customers can only choose welders who show at least ' + NEED + ' photos of their work. Add ' + (NEED - pf.length) + ' more to appear in their list. You still receive jobs sent to everyone.</p>') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
      pf.map(function (p) {
        return '<span style="position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)">' +
          '<img src="' + esc(p.url) + '" alt="My work" style="width:100%;height:100%;object-fit:cover">' +
          '<button type="button" data-pf="' + esc(p.id) + '" aria-label="Remove photo" style="position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:14px;line-height:1">&times;</button></span>';
      }).join('') +
      '</div>' +
      '<div class="row" style="margin-top:10px">' +
      '<label class="btn btn-primary btn-sm" style="cursor:pointer"><i class="ti ti-photo" aria-hidden="true"></i>Add photos of your work' +
      '<input type="file" id="pfAdd" accept="image/*" multiple style="display:none"></label>' +
      '<span class="hint">' + pf.length + ' of 12 added. JPG or PNG.</span></div>' +
      '</div>';

    $('#box').innerHTML = head +
      '<div id="pushBox"></div>' + pfCard +
      '<div class="row" style="margin-top:16px;justify-content:space-between">' +
      '<h2 style="font-size:30px">Your jobs <span class="hint" style="font-weight:400">(' + board.jobs.length + ')</span></h2>' +
      '<button type="button" class="btn btn-quiet btn-sm" id="refresh"><i class="ti ti-refresh" aria-hidden="true"></i>Refresh</button></div>' +
      jobs;

    $('#refresh').addEventListener('click', function () { loadBoard(); });
    $('#toggleAv').addEventListener('click', function () {
      var b = this; b.disabled = true;
      API.updateWorker(w.id, { available: !w.available }).then(loadBoard)
        .catch(function () { b.disabled = false; });
    });

    renderPushBox();
    ensurePush();
    startBoardChannel();

    var pfIn = $('#pfAdd');
    if (pfIn) pfIn.addEventListener('change', function () {
      var files = this.files;
      this.value = '';
      if (!files || !files.length) return;
      if (pf.length + files.length > 12) { toast('Maximum of 12 photos.', true); return; }
      toast('Uploading your work...');
      API.uploadPhotos('work-' + w.id, Array.prototype.slice.call(files, 0, 3)).then(function (urls) {
        return API.addWorkerPhotos(w.id, urls);
      }).then(function () {
        toast('Photos added');
        return loadBoard();
      }).catch(function () {
        toast('Could not upload. Try smaller photos or check your internet.', true);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pf]'), function (btn) {
      btn.addEventListener('click', function () {
        if (!window.confirm('Remove this photo from your portfolio?')) return;
        API.deleteWorkerPhoto(btn.getAttribute('data-pf')).then(function () { return loadBoard(); })
          .catch(function () { toast('Could not remove. Try again.', true); });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act'), tk = btn.getAttribute('data-token');
        btn.disabled = true;
        API.respondOffer(tk, act === 'take').then(function () { return loadBoard(); })
          .catch(function () {
            btn.disabled = false;
            var card = btn.closest ? btn.closest('.job') : null;
            var e = card && card.querySelector('[data-jerr]');
            if (e) e.textContent = 'Could not reach the website. Check your internet and try again.';
          });
      });
    });
  }

  function loadBoard() {
    return Promise.all([API.getMyWorker(), API.listMyJobs(), API.listWorkerPhotos()]).then(function (r) {
      if (!r[0]) { showNoAccess(); return; }
      board.worker = r[0];
      board.jobs = r[1] || [];
      board.photos = (r[2] || []).filter(function (p) { return p.worker_id === r[0].id; });
      $('#signOut').hidden = false;
      renderBoard();
    }).catch(function () {
      $('#box').innerHTML = '<div class="card"><h2>Could not load</h2><p>Check your internet and press refresh on this page.</p>' +
        '<div class="row"><button class="btn btn-quiet" type="button" onclick="location.reload()">Try again</button></div></div>';
    });
  }

  /* ---------------- job alerts: toast, beep, web push, live channel ---------------- */
  function toast(msg, bad) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { t.className = 'toast'; }, 3600);
  }

  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      beep.ctx = beep.ctx || new Ctx();
      var ctx = beep.ctx, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.52);
    } catch (e) {}
  }

  function urlB64ToUint8Array(b64) {
    var pad = '='.repeat((4 - b64.length % 4) % 4);
    var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function canPush() {
    // Push delivery needs the Supabase edge function; keep the UI off until it is deployed.
    return cfg.PUSH_ENABLED === true && 'serviceWorker' in navigator && 'PushManager' in window &&
      'Notification' in window && location.protocol === 'https:' && !API.demo;
  }

  var pushSaved = false;
  function doSubscribe() {
    return navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8Array(cfg.PUSH_PUBLIC_KEY)
      });
    }).then(function (sub) {
      pushSaved = true;
      renderPushBox();
      return API.savePushSub(sub.toJSON());
    }).catch(function () {
      pushSaved = false;
      renderPushBox();
      return null;
    });
  }

  // If permission was already granted earlier, quietly refresh the subscription.
  function ensurePush() {
    if (!canPush() || pushSaved) return;
    if (Notification.permission === 'granted') doSubscribe();
    else renderPushBox();
  }

  function renderPushBox() {
    var box = $('#pushBox');
    if (!box) return;
    if (!canPush()) { box.innerHTML = ''; return; }
    if (Notification.permission === 'granted') {
      box.innerHTML = '<div class="job" style="margin-top:14px"><h3 style="font-size:20px">Job alerts are on</h3>' +
        '<p class="hint">Your phone will alert you the moment a new job arrives, even when this page is closed. ' +
        'On iPhone, add this page to your Home Screen (Share, then Add to Home Screen) so alerts reach you.</p></div>';
      return;
    }
    if (Notification.permission === 'denied') {
      box.innerHTML = '<div class="job" style="margin-top:14px"><p class="hint">Alerts are blocked for this site. ' +
        'Allow notifications in your browser settings to get job alerts.</p></div>';
      return;
    }
    box.innerHTML = '<div class="job" style="margin-top:14px"><div class="row">' +
      '<button type="button" class="btn btn-primary btn-sm" id="pushOn"><i class="ti ti-bell" aria-hidden="true"></i>Turn on job alerts</button>' +
      '<span class="hint">Get a phone alert the moment a new job arrives, even when this page is closed.</span></div></div>';
    $('#pushOn').addEventListener('click', function () {
      var b = this; b.disabled = true;
      Notification.requestPermission().then(function (p) {
        if (p !== 'granted') {
          b.disabled = false;
          renderPushBox();
          toast('Alerts stay off until you allow notifications.', true);
          return;
        }
        doSubscribe().then(function () { b.disabled = false; toast('Job alerts are on'); });
      });
    });
  }

  var boardCh = null;
  function startBoardChannel() {
    var sb = API.getSb();
    if (!sb || boardCh || API.demo || !board.worker) return;
    boardCh = sb.channel('welder-board-' + board.worker.id);
    boardCh
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'offers',
        filter: 'worker_id=eq.' + board.worker.id
      }, function () {
        toast('New job for you');
        beep();
        loadBoard();
      })
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'offers',
        filter: 'worker_id=eq.' + board.worker.id
      }, function () { loadBoard(); })
      .subscribe();
  }

  function showApp() { loadBoard(); }

  /* ---------------- routing ---------------- */
  function doSignOut() {
    API.signOut().then(function () { showSignIn(); }).catch(function () { showSignIn(); });
  }

  function showDbError() {
    $('#signOut').hidden = false;
    $('#box').innerHTML =
      '<div class="card" style="max-width:560px;margin:40px auto">' +
      '<h2>Database not ready</h2>' +
      '<p class="note">The sign-in worked, but the website cannot read roles yet because <code>supabase-setup.sql</code> has not been run in Supabase.</p>' +
      '<p class="hint">Open Supabase &rarr; SQL Editor, paste that file, press Run, then reload this page.</p>' +
      '<div class="row"><button class="btn btn-primary" type="button" onclick="location.reload()">I ran it - reload</button>' +
      '<button class="btn btn-quiet" type="button" id="out3">Sign out</button></div></div>';
    var b = $('#out3');
    if (b) b.addEventListener('click', doSignOut);
  }

  function afterSignIn() {
    return API.getMyRole().then(function (role) {
      if (role === 'owner') { location.href = 'owner.html'; return; }
      if (role === 'staff') { location.href = 'admin.html'; return; }
      // welder or not set up yet
      return API.getMyWorker().then(function (w) {
        if (w) { board.worker = w; loadBoard(); return; }
        var i = pendingIntent();
        if (i && i.name && i.phone && i.pin) { return finishSetup(i.name, i.phone, i.pin); }
        showSetup();
      }).catch(function () { showSetup(); });
    }).catch(showDbError);
  }

  $('#signOut').addEventListener('click', doSignOut);

  // Keep Refresh alive in the background so new jobs appear.
  setInterval(function () {
    if (board.worker && document.querySelector('#refresh')) loadBoard();
  }, 45000);

  /* ---------------- start ---------------- */
  if (token) {
    runOfferLink();
  } else {
    API.getSession().then(function (s) {
      if (s) afterSignIn();
      else showSignIn();
    }).catch(function () { showSignIn(); });
  }
})();
</script>
